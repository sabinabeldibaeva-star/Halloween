<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween Vocabulary</title>
<style>
  :root{
    --dark:#3d2464;
    --dark-2:#4a2c7a;
    --purple:#7c4dcc;
    --purple-d:#5b3a99;
    --lav:#d9c9f5;
    --lav-2:#cbb6ee;
    --light:#f4effc;
    --white:#fff;
    --ink:#2b1b45;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}

  body{
    margin:0;
    padding:26px 16px 70px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 10% 4%,#efe6ff 0%,rgba(239,230,255,0) 42%),
      radial-gradient(circle at 92% 0%,#e6dbff 0%,rgba(230,219,255,0) 38%),
      #f8f6fd;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }

  .wrap{max-width:900px;margin:0 auto;}
  header{text-align:center;margin-bottom:26px;}

  .deco{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px;}
  .spark{color:#a98fe0;font-size:15px;line-height:1;animation:twinkle 2.6s ease-in-out infinite;}
  .spark.small{font-size:11px;animation-delay:1.1s;}
  @keyframes twinkle{
    0%,100%{opacity:.35;transform:scale(.88);}
    50%{opacity:1;transform:scale(1.12);}
  }

  h1{
    margin:0 0 14px;
    font-size:clamp(1.35rem,3.6vw,1.95rem);
    line-height:1.25;
    letter-spacing:-.01em;
    color:var(--dark);
  }

  .instr{
    margin:0 auto;
    max-width:640px;
    background:var(--white);
    border:1px solid #ebe1fb;
    border-radius:16px;
    padding:14px 20px;
    font-size:1rem;
    line-height:1.5;
    color:#4a3a6b;
    box-shadow:0 4px 14px rgba(93,58,153,.07);
  }
  .instr strong{color:var(--dark-2);}
  .tip{margin:12px auto 0;max-width:640px;font-size:.85rem;color:#8878ad;}

  .exercise{
    background:var(--white);
    border:1px solid #ece2fb;
    border-radius:18px;
    padding:18px 18px 14px;
    margin-bottom:18px;
    box-shadow:0 4px 16px rgba(93,58,153,.08);
  }

  .ex-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}

  .badge{
    width:28px;height:28px;flex:0 0 28px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--purple),var(--purple-d));
    color:#fff;
    font-weight:700;
    font-size:.85rem;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 6px rgba(92,58,153,.35);
  }

  .ex-label{
    font-weight:700;
    font-size:.95rem;
    color:var(--dark-2);
    letter-spacing:.01em;
  }

  .drop-area{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:10px;
    border-radius:14px;
    min-height:62px;
    align-content:flex-start;
  }

  .bank{
    background:var(--light);
    border:1.5px solid #e3d8f8;
    margin-bottom:12px;
  }

  .dropzone{
    background:#fbf9ff;
    border:2px dashed var(--lav-2);
    transition:background .15s,border-color .15s;
  }

  .dropzone:empty::before{
    content:"Drop the words here…";
    display:block;
    padding:12px 8px;
    color:#a894cd;
    font-style:italic;
    font-size:.9rem;
  }

  .dropzone.correct{border-color:#4bbf7a;background:#f2fdf6;}
  .dropzone.wrong{border-color:#e08a8a;background:#fff7f7;}

  .card{
    background:var(--white);
    border:2px solid var(--lav-2);
    border-radius:10px;
    padding:9px 15px;
    font-size:1rem;
    font-weight:600;
    line-height:1.1;
    color:var(--dark);
    box-shadow:0 2px 0 #ded0f7,0 3px 9px rgba(93,58,153,.10);
    cursor:grab;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
    transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;
  }

  .card:hover{
    border-color:#9a6ee0;
    transform:translateY(-2px);
    box-shadow:0 4px 0 #ded0f7,0 6px 14px rgba(93,58,153,.18);
  }

  .card:active{cursor:grabbing;}
  body.dragging{cursor:grabbing;}

  .ghost{
    position:fixed;
    z-index:9999;
    pointer-events:none;
    transform:rotate(-2deg) scale(1.04);
    border-color:var(--purple)!important;
    box-shadow:0 12px 35px rgba(93,58,153,.30)!important;
    opacity:.96;
  }

  .placeholder{
    border-radius:10px;
    border:2px dashed #b79ce8;
    background:rgba(200,180,240,.28);
    box-sizing:border-box;
  }

  .feedback{min-height:22px;margin-top:10px;font-size:.95rem;font-weight:700;}
  .feedback.fb-ok{color:#1e8a4c;}
  .feedback.fb-no{color:#c0392b;}

  .controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:14px;
    margin:28px 0 8px;
  }

  .btn{
    font-family:inherit;
    font-size:1rem;
    font-weight:700;
    padding:14px 34px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
  }

  .btn-primary{
    background:linear-gradient(135deg,var(--purple),var(--purple-d));
    color:#fff;
    box-shadow:0 6px 18px rgba(92,58,153,.32);
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(92,58,153,.38);}

  .btn-secondary{
    background:#fff;
    color:var(--purple-d);
    border:2px solid var(--lav-2);
    box-shadow:0 3px 10px rgba(93,58,153,.08);
  }
  .btn-secondary:hover{transform:translateY(-2px);border-color:#a98fe0;}
  .btn:active{transform:translateY(0) scale(.985);}

  .final{
    display:none;
    margin:26px auto 0;
    max-width:620px;
    text-align:center;
    background:linear-gradient(135deg,#efe6ff,#f9f5ff);
    border:2px solid var(--lav-2);
    border-radius:18px;
    padding:20px 22px;
    font-size:1.12rem;
    font-weight:800;
    color:var(--dark-2);
    box-shadow:0 8px 24px rgba(93,58,153,.14);
  }

  .final.show{display:block;animation:pop .55s cubic-bezier(.2,1.3,.5,1);}
  @keyframes pop{
    0%{transform:scale(.85);opacity:0;}
    100%{transform:scale(1);opacity:1;}
  }

  .confetti{
    position:fixed;
    top:-46px;
    pointer-events:none;
    z-index:999;
    animation-name:fall;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
  }
  @keyframes fall{
    to{transform:translateY(112vh) rotate(380deg);opacity:.15;}
  }

  @media(max-width:520px){
    body{padding:18px 10px 60px;}
    .exercise{padding:14px 12px 12px;border-radius:16px;}
    .card{padding:8px 12px;font-size:.95rem;}
    .btn{padding:13px 26px;font-size:.95rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="deco" aria-hidden="true">
      <span class="spark small">✦</span>
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20.5 14.2A8.5 8.5 0 1 1 10.3 3.6a6.8 6.8 0 0 0 10.2 10.6Z"
              fill="#d9c9f5" stroke="#7c4dcc" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
      <span class="spark">✦</span>
    </div>
    <h1>Halloween Vocabulary</h1>
    <p class="instr">
      <strong>Put the words in the correct order to make meaningful sentences.
      Then check your answers with a partner.</strong>
    </p>
    <p class="tip">Drag the word cards into the box (or tap a card to move it). You can move them again any time.</p>
  </header>

  <main id="exercises"></main>

  <div class="controls">
    <button id="checkBtn" class="btn btn-primary" type="button">Check Answers</button>
    <button id="resetBtn" class="btn btn-secondary" type="button">Reset</button>
  </div>

  <div id="final" class="final" role="status" aria-live="polite">
    🎃 Excellent! All six sentences are correct! 🎃
  </div>
</div>

<script>
(function(){
  "use strict";

  const EXERCISES=[
    {
      words:["believed","the","old","house","is","to","be","haunted"],
      answer:"The old house is believed to be haunted."
    },
    {
      words:["story","the","terrifying","events","contains","supernatural","several"],
      answer:"The story contains several terrifying supernatural events."
    },
    {
      words:["wore","a","identity","disguise","her","hide","she","to"],
      answer:"She wore a disguise to hide her identity."
    },
    {
      words:["witchcraft","villagers","she","the","practised","believed","secretly"],
      answer:"The villagers believed she practised witchcraft secretly."
    },
    {
      words:["witch","spell","cast","the","yesterday","powerful","a"],
      answer:"The witch cast a powerful spell yesterday."
    },
    {
      words:["night","experience","everyone","terrifying","frightened","at","the"],
      answer:"The terrifying experience frightened everyone at night."
    }
  ];

  EXERCISES.forEach(function(ex){
    ex.correct=ex.answer.replace(/[.!?]/g,"").trim().split(/\s+/);
  });

  function shuffleWords(words,correct){
    const arr=words.slice();
    for(let attempt=0;attempt<60;attempt++){
      for(let i=arr.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        const tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
      }
      const sameAsAnswer=arr.length===correct.length &&
        arr.every(function(w,i){return w.toLowerCase()===correct[i].toLowerCase();});
      if(!sameAsAnswer)break;
    }
    return arr;
  }

  const START_ORDER=EXERCISES.map(function(ex){
    return shuffleWords(ex.words,ex.correct);
  });

  const exercisesRoot=document.getElementById("exercises");

  function makeCard(word){
    const el=document.createElement("div");
    el.className="card";
    el.textContent=word;
    el.dataset.word=word;
    return el;
  }

  function render(){
    exercisesRoot.innerHTML="";

    EXERCISES.forEach(function(ex,i){
      const sec=document.createElement("section");
      sec.className="exercise";
      sec.dataset.index=String(i);

      const head=document.createElement("div");
      head.className="ex-head";
      head.innerHTML='<span class="badge">'+(i+1)+'</span>'+
        '<span class="ex-label">Put the words in the correct order</span>';
      sec.appendChild(head);

      const bank=document.createElement("div");
      bank.className="drop-area bank";
      bank.dataset.role="bank";
      START_ORDER[i].forEach(function(w){bank.appendChild(makeCard(w));});

      const dropzone=document.createElement("div");
      dropzone.className="drop-area dropzone";
      dropzone.dataset.role="dropzone";

      const fb=document.createElement("div");
      fb.className="feedback";
      fb.setAttribute("aria-live","polite");

      sec.appendChild(bank);
      sec.appendChild(dropzone);
      sec.appendChild(fb);
      exercisesRoot.appendChild(sec);
    });
  }

  let dragState=null;

  function onPointerDown(e){
    if(dragState)return;
    if(e.isPrimary===false)return;
    if(e.button!==undefined && e.button!==0)return;

    const card=e.target.closest ? e.target.closest(".card") : null;
    if(!card || card.classList.contains("ghost"))return;

    e.preventDefault();

    const rect=card.getBoundingClientRect();
    const ghost=card.cloneNode(true);
    ghost.classList.add("ghost");
    ghost.style.width=rect.width+"px";
    ghost.style.height=rect.height+"px";
    ghost.style.left=rect.left+"px";
    ghost.style.top=rect.top+"px";
    document.body.appendChild(ghost);

    const placeholder=document.createElement("div");
    placeholder.className="placeholder";
    placeholder.style.width=rect.width+"px";
    placeholder.style.height=rect.height+"px";
    card.parentNode.insertBefore(placeholder,card);
    card.style.display="none";

    dragState={
      card:card,
      ghost:ghost,
      placeholder:placeholder,
      startX:e.clientX,
      startY:e.clientY,
      offsetX:e.clientX-rect.left,
      offsetY:e.clientY-rect.top,
      moved:false
    };

    document.body.classList.add("dragging");
    window.addEventListener("pointermove",onPointerMove,{passive:false});
    window.addEventListener("pointerup",onPointerUp);
    window.addEventListener("pointercancel",onPointerUp);
  }

  function onPointerMove(e){
    if(!dragState)return;

    const dx=e.clientX-dragState.startX;
    const dy=e.clientY-dragState.startY;
    if(!dragState.moved && Math.sqrt(dx*dx+dy*dy)<6)return;

    dragState.moved=true;
    e.preventDefault();

    dragState.ghost.style.left=(e.clientX-dragState.offsetX)+"px";
    dragState.ghost.style.top=(e.clientY-dragState.offsetY)+"px";

    const under=document.elementFromPoint(e.clientX,e.clientY);
    if(!under || !under.closest)return;

    const area=under.closest(".drop-area");
    if(!area)return;

    const sourceExercise=dragState.card.closest(".exercise");
    if(area.closest(".exercise")!==sourceExercise)return;

    const cards=Array.prototype.filter.call(area.children,function(child){
      return child.classList.contains("card") && child!==dragState.card;
    });

    let ref=null;
    let insertBefore=true;
    let best=Infinity;

    cards.forEach(function(c){
      const r=c.getBoundingClientRect();
      const cx=r.left+r.width/2;
      const cy=r.top+r.height/2;
      const d=Math.sqrt((e.clientX-cx)*(e.clientX-cx)+(e.clientY-cy)*(e.clientY-cy));
      if(d<best){
        best=d;
        ref=c;
        insertBefore=e.clientX<cx;
      }
    });

    if(!ref){
      area.appendChild(dragState.placeholder);
    }else{
      area.insertBefore(dragState.placeholder,insertBefore ? ref : ref.nextSibling);
    }
  }

  function onPointerUp(){
    if(!dragState)return;

    const st=dragState;
    dragState=null;

    window.removeEventListener("pointermove",onPointerMove);
    window.removeEventListener("pointerup",onPointerUp);
    window.removeEventListener("pointercancel",onPointerUp);

    document.body.classList.remove("dragging");
    st.ghost.remove();
    st.card.style.display="";

    if(!st.moved){
      st.placeholder.remove();
      const exercise=st.card.closest(".exercise");
      const currentArea=st.card.parentElement;
      const isBank=currentArea.classList.contains("bank");
      const target=isBank ? exercise.querySelector(".dropzone") : exercise.querySelector(".bank");
      target.appendChild(st.card);
    }else{
      st.placeholder.parentNode.insertBefore(st.card,st.placeholder);
      st.placeholder.remove();
    }

    clearFeedback(st.card.closest(".exercise"));
  }

  function clearFeedback(section){
    if(!section)return;
    const fb=section.querySelector(".feedback");
    if(fb){
      fb.textContent="";
      fb.className="feedback";
    }
    const dz=section.querySelector(".dropzone");
    if(dz)dz.classList.remove("correct","wrong");
    document.getElementById("final").classList.remove("show");
  }

  function checkAnswers(){
    let allCorrect=true;

    Array.prototype.forEach.call(document.querySelectorAll(".exercise"),function(sec){
      const index=Number(sec.dataset.index);
      const dz=sec.querySelector(".dropzone");
      const fb=sec.querySelector(".feedback");

      const words=Array.prototype.map.call(dz.querySelectorAll(".card"),function(c){
        return c.dataset.word;
      });

      const correct=EXERCISES[index].correct;
      const isCorrect=words.length===correct.length &&
        words.every(function(w,i){return w.toLowerCase()===correct[i].toLowerCase();});

      if(isCorrect){
        fb.className="feedback fb-ok";
        fb.textContent="✓ Correct!";
        dz.classList.add("correct");
        dz.classList.remove("wrong");
      }else{
        allCorrect=false;
        fb.className="feedback fb-no";
        fb.textContent="✗ Try again";
        dz.classList.add("wrong");
        dz.classList.remove("correct");
      }
    });

    const finalMsg=document.getElementById("final");
    if(allCorrect){
      finalMsg.classList.add("show");
      celebrate();
    }else{
      finalMsg.classList.remove("show");
    }
  }

  function celebrate(){
    const emojis=["🎃","✨","🦇","🌙","⭐","🍬"];
    for(let i=0;i<18;i++){
      const s=document.createElement("span");
      s.className="confetti";
      s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      s.style.left=Math.random()*100+"vw";
      s.style.fontSize=(13+Math.random()*12)+"px";
      s.style.animationDuration=(2.4+Math.random()*1.8)+"s";
      s.style.animationDelay=(Math.random()*0.6)+"s";
      document.body.appendChild(s);
      setTimeout(function(){s.remove();},4800);
    }
  }

  function resetAll(){
    render();
    document.getElementById("final").classList.remove("show");
  }

  document.addEventListener("pointerdown",onPointerDown);
  document.addEventListener("dragstart",function(e){e.preventDefault();});
  document.getElementById("checkBtn").addEventListener("click",checkAnswers);
  document.getElementById("resetBtn").addEventListener("click",resetAll);

  render();
})();
</script>
</body>
</html>
